


<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
 <meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

  <title>Насосная станция</title>

  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>

.components-section{
    width:100%;
    padding:80px 10%;
}

.links-table{
    width:100%;
    border-collapse:collapse;
    font-family:'Century Gothic', sans-serif;
}

.links-table th{
    text-align:left;
    padding:20px;
    border-bottom:1px solid #ddd;
    font-weight:600;
}

.links-table td{
    padding:22px 20px;
    border-bottom:1px solid #eee;
}

.links-table a{
    color:black;
    text-decoration:none;
}
    

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #ffffff;
      color: #111111;
        font-family:
    "Century Gothic",
    "Apple Gothic",
    "Trebuchet MS",
    Arial,
    sans-serif;
      -webkit-text-size-adjust:100%;
      overflow-x: hidden;
    }


.hero{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:60px 20px;
  text-align:center;
  background:
    radial-gradient(circle at top,#f4f4f4 0%,#ffffff 60%);
}

h1{
  font-size:72px;
  font-weight:normal;
  letter-spacing:-2px;
  margin-bottom:20px;
}

.subtitle{
  font-size:22px;
  color:#666;
  max-width:700px;
  line-height:1.6;
  margin-bottom:40px;
}




    .passport-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;

  padding:16px 34px;

  background:#111;
  color:#fff;

  border:1px solid #111;
  border-radius:999px;

  text-decoration:none;
}

    .passport-btn:hover{
  background:#333;
  color:#fff;
}

  .model-wrapper{
  width:100%;
  max-width:100%;
  height:70vh;
  margin:0 auto;
  display:flex;
  justify-content:center;
  align-items:center;
}

.links-table td:first-child,
.links-table th:first-child{
  white-space:normal;
  word-break:break-word;
  overflow-wrap:anywhere;
}
    

    @media (max-width:768px){

  .model-wrapper{
    height:350px;
  }

}

   model-viewer {
  width: 100%;
  height: 100%;
  display:block;
  background: linear-gradient(to bottom, #f8f8f8, #ececec);
}

    .section {
  width: 100%;
  max-width: 100%;
  margin: 60px auto;
  padding: 0 10px;
  box-sizing:border-box;
}


    .hero,
.model-wrapper,
.section,
.table-container,
.links-table{
  max-width:100%;
}

    h2 {
      font-size: 52px;
      font-weight: normal;
      margin-bottom: 40px;
      letter-spacing: -1px;
    }

  @media (max-width:768px){

  .links-table{
    width:100%;
    table-layout:fixed;
  }

  .links-table th,
  .links-table td{
    padding:8px 4px;
    font-size:12px;
  }

  .links-table th:nth-child(1),
  .links-table td:nth-child(1){
    width:50%;
    word-break:break-word;
    overflow-wrap:anywhere;
  }

  .links-table th:nth-child(2),
  .links-table td:nth-child(2){
    width:25%;
    text-align:center;
  }

  .links-table th:nth-child(3),
  .links-table td:nth-child(3){
    width:25%;
    text-align:center;
  }

}

 
    .links-table tr:last-child td {
      border-bottom: none;
    }

    .links-table tr {
      transition: 0.2s ease;
    }

    .links-table tr:hover {
      background: #fafafa;
    }

    .links-table a {
      color: #111;
      text-decoration: none;
      transition: 0.2s ease;
    }

    .links-table a:hover {
      opacity: 0.6;
    }

    .description {
  width: 100%;
  max-width: 100%;
  font-size: 18px;
  line-height: 1.7;
  color: #333;
}
    

    footer {
      text-align: center;
      padding: 60px 20px;
      color: #777;
      font-size: 15px;
    }


@media (max-width:768px){

  .hero{
    padding:30px 15px;
    min-height:auto;
  }

  h1{
    font-size:42px;
    line-height:1.1;
    margin-bottom:15px;
  }

  h2{
    font-size:36px;
    margin-bottom:20px;
  }

  .subtitle{
    font-size:17px;
    margin-bottom:25px;
  }

  .passport-btn{
    margin-bottom:35px;
    padding:14px 28px;
  }

  .model-wrapper{
    width:100%;
    height:45vh;
    min-height:300px;
    border-radius:20px;
  }

  .section{
    margin:60px auto;
    padding:0 15px;
  }

  .description{
    font-size:15px;
    line-height:1.6;
  }

  .table-container{
    overflow-x:hidden;
  }

  .links-table{
    width:100%;
    table-layout:fixed;
  }

  .links-table th,
  .links-table td{
    padding:8px 4px;
    font-size:12px;
  }

  .links-table th:nth-child(1),
  .links-table td:nth-child(1){
    width:50%;
    white-space:normal;
    word-break:break-word;
    overflow-wrap:anywhere;
  }

  .links-table th:nth-child(2),
  .links-table td:nth-child(2){
    width:25%;
    text-align:center;
    white-space:nowrap;
  }

  .links-table th:nth-child(3),
  .links-table td:nth-child(3){
    width:25%;
    text-align:center;
    white-space:nowrap;
  }


 #description th,
  #description td{
    padding:2px 4px;
    font-size:13px;
  }
  

}



#description table {
  width: 100%;
  margin: 30px 0;
  border-collapse: collapse;
 table-layout: fixed;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 8px 30px rgba(0,0,0,0.06);
}

#description th {
  background: #fafafa;
}

#description th,
#description td {
  padding: 6px;
  border: 1px solid #eee;
}


  

#description th,
#description td{
  word-break: break-word;
  overflow-wrap: anywhere;
}

html,
body{
  width:100%;
  max-width:100%;
  overflow-x:hidden;
}


    #description h1{
  font-size:28px;
}

#description h2{
  font-size:24px;
}

#description h3{
  font-size:20px;
}


    
    
  </style>
</head>

<body>

  <section class="hero">

    <h1>Насосная станция</h1>

    <div class="subtitle">
      Насосная часть эскимогенератора.
    </div>

    <a class="passport-btn"
       href="/public/docs/схема Эскимогенератор чая .pdf"
       target="_blank">
      Скачать паспорт
    </a>

    
   <div class="model-wrapper">

 <model-viewer
  src="stantion.glb"
  camera-controls
  auto-rotate
  auto-rotate-delay="0"
  rotation-per-second="2deg"
  camera-target="0m 0m 0m"
  interaction-prompt="none"
  shadow-intensity="1"
  exposure="1">
</model-viewer> 
      
  </div>
    
</section>

<section class="section">

  <h2>Комплектующие</h2>

  <div class="table-container">

    <table class="links-table" id="partsTable">
    </table>

  </div>

</section>
    
      
<section class="section">

  <h2>Описание работы установки</h2>

  <div id="description" class="description"></div>

</section>

  <footer>
    Industrial Engineering Platform
  </footer>


<script>

fetch('/public/data/list_comp.json')

  .then(response => response.json())

  .then(data => {

    const table = document.getElementById('partsTable');

    table.innerHTML = `
      <tr>
        <th>Название</th>
        <th>Количество</th>
        <th>Открыть</th>
      </tr>
    `;

    data.forEach(item => {

      table.innerHTML += `
        <tr>
          <td>${item["Название"]}</td>
          <td>${item["Количество"]}</td>
          <td>
            ${item["Открыть"]
              ? `<a href="${item["Открыть"]}" target="_blank">Открыть</a>`
              : '—'}
          </td>
        </tr>
      `;

    });

  });

</script>


 <script src="https://unpkg.com/mammoth/mammoth.browser.min.js"></script>

<script>
fetch('/public/docs/description.docx')
  .then(response => response.arrayBuffer())
  .then(arrayBuffer => mammoth.convertToHtml({ arrayBuffer }))
  .then(result => {
    document.getElementById('description').innerHTML = result.value;
  })
  .catch(error => console.error(error));
</script>


  
  
</body>

</html>
